name: ldl-x86-wechat
services:
  android:
    image: redroid/redroid:14.0.0_64only-latest@sha256:46478a567194aed24cd0877d4434a9e58b534d4aad30931eb21999a52f2ce131
    platform: linux/arm64
    privileged: true
    network_mode: none
    command:
      - androidboot.use_memfd=1
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=240
      - androidboot.redroid_fps=10
      - ro.enable.native.bridge.exec=0
      - ro.hw_timeout_multiplier=8
    volumes:
      - wechat-data:/data
volumes:
  wechat-data:
